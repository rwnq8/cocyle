<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocycle Visualizer | Cocyle</title>
<meta name="description" content="Watch cognitive dissonance resolution — three patches, one cocycle condition.">
<link rel="stylesheet" href="../css/style.css">
<style>
  body { margin: 0; background: #fdfcfa; }
  .back { padding: 8px 16px; font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; }
  .back a { color: #8b4513; text-decoration: none; }
  .wrap { max-width: 800px; margin: 0 auto; padding: 0 16px 2rem; }
  canvas { display: block; width: 100%; height: 420px; border: 1px solid #e0ddd5; background: #fafaf7; margin: 12px 0; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  .controls button { padding: 8px 18px; border: none; cursor: pointer; font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; border-radius: 4px; color: #fff; }
  .btn-go { background: #8b4513; }
  .btn-step { background: #666; }
  .btn-reset { background: #888; }
  .dw-display { font-family: "SFMono-Regular", Consolas, monospace; font-size: 16px; margin-left: auto; color: #5e5e5e; }
  .step-list { font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; max-height: 180px; overflow-y: auto; background: #f5f2ec; padding: 10px 14px; border: 1px solid #e0ddd5; line-height: 1.6; }
  .step-list .v { color: #b0562a; }
  .step-list .ok { color: #2a6e4f; }
  .status { padding: 12px 16px; margin: 12px 0; border-radius: 4px; display: none; }
  .status.show { display: block; }
  .status.resolved { background: #eaf5ea; border-left: 3px solid #2a6e4f; }
</style>
</head>
<body>
<div class="back"><a href="../index.html">← The Branch and the Shadow</a></div>

<div class="wrap">
  <h1>🧩 Cocycle Resolution Visualizer</h1>
  <p style="color:#5e5e5e;margin-bottom:12px;">Three belief patches (A, B, C) on an ultrametric tree. When δω ≠ 0, the system gradient-descents toward global consistency.</p>

  <div class="controls">
    <button class="btn-go" id="btn-animate">▶ Animate</button>
    <button class="btn-step" id="btn-step">⏭ Step</button>
    <button class="btn-reset" id="btn-reset">↺ Reset</button>
    <span class="dw-display">δω = <strong id="dw-display">—</strong></span>
  </div>

  <canvas id="viz"></canvas>
  <div class="step-list" id="log"><span style="color:#888;">Press ▶ to animate the resolution</span></div>
  <div class="status" id="status"></div>
</div>

<script>
(function() {
  const DEPTH = 5, P = 2, N = Math.pow(P, DEPTH);
  const initialPositions = [3, 15, 28];
  let positions = [...initialPositions];
  let stepNum = 0;
  let intervalId = null;
  const canvas = document.getElementById('viz');
  const ctx = canvas.getContext('2d');
  const colors = ['#e07030', '#3080d0', '#30a060'];

  function lcaDist(i, j) {
    let d = 0;
    for (let b = DEPTH - 1; b >= 0; b--) {
      if (((i >> b) & 1) === ((j >> b) & 1)) d++; else break;
    }
    return DEPTH - d;
  }

  function cocycleNorm() {
    const d01 = lcaDist(positions[0], positions[1]);
    const d02 = lcaDist(positions[0], positions[2]);
    const d12 = lcaDist(positions[1], positions[2]);
    return Math.max(0, d01 - Math.max(d02, d12)) +
           Math.max(0, d02 - Math.max(d01, d12)) +
           Math.max(0, d12 - Math.max(d01, d02));
  }

  function draw() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    const mx = 20, my = 30, bx = W - 20, by = H - 40;
    const spacing = (bx - mx) / (N - 1);
    const lvlH = (by - my) / DEPTH;
    
    // Draw tree
    function branch(lv, s, e, px, py) {
      if (lv >= DEPTH) return;
      const y = my + lv * lvlH;
      const segs = [];
      let ss = s;
      for (let i = s + 1; i <= e; i++) {
        // Check if digit at this level changes compared to segStart
        let same = true;
        for (let b = DEPTH - 1; b >= DEPTH - 1 - lv; b--) {
          if (((ss >> b) & 1) !== ((i >> b) & 1)) { same = false; break; }
        }
        if (!same) { segs.push({s:ss,e:i-1}); ss = i; }
      }
      segs.push({s:ss,e:e});
      for (const seg of segs) {
        const midX = mx + ((seg.s + seg.e) / 2) * spacing;
        if (px !== null) {
          ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(midX, y);
          ctx.strokeStyle = '#ddd'; ctx.lineWidth = 0.5; ctx.stroke();
        }
        branch(lv + 1, seg.s, seg.e, midX, y);
      }
    }
    branch(0, 0, N - 1, null, null);
    
    // Draw leaf dots (subtle)
    for (let i = 0; i < N; i++) {
      const x = mx + i * spacing;
      ctx.beginPath(); ctx.arc(x, by, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ddd'; ctx.fill();
    }
    
    // Draw patches
    for (let p = 0; p < 3; p++) {
      const x = mx + positions[p] * spacing;
      ctx.beginPath(); ctx.arc(x, by, 10, 0, Math.PI * 2);
      ctx.fillStyle = colors[p]; ctx.fill();
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = colors[p];
      ctx.fillText(['A','B','C'][p], x + 14, by + 4);
    }
    
    // Draw distance lines
    const pairs = [[0,1],[0,2],[1,2]];
    const dv = cocycleNorm();
    for (let pi = 0; pi < 3; pi++) {
      const a = positions[pairs[pi][0]], b = positions[pairs[pi][1]];
      const ax = mx + a * spacing, bx2 = mx + b * spacing;
      const d = lcaDist(a, b);
      ctx.beginPath(); ctx.setLineDash([4, 4]);
      ctx.moveTo(ax, by - 20 - pi * 4); ctx.lineTo(bx2, by - 20 - pi * 4);
      ctx.strokeStyle = dv > 0 ? 'rgba(180,80,40,0.7)' : 'rgba(40,100,60,0.7)';
      ctx.lineWidth = 1; ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = '10px monospace'; ctx.fillStyle = dv > 0 ? '#b05028' : '#28643c';
      ctx.fillText('d='+d, (ax+bx2)/2 - 10, by - 25 - pi * 4);
    }
    
    document.getElementById('dw-display').textContent = dv.toFixed(1);
  }

  function step() {
    const dv = cocycleNorm();
    if (dv === 0) return;
    for (let i = 0; i < 3; i++) {
      const j = (i + 1) % 3, k = (i + 2) % 3;
      const mid = Math.round((positions[j] + positions[k]) / 2);
      positions[i] = Math.max(0, Math.min(N - 1, Math.round(positions[i] + (mid - positions[i]) * 0.5)));
    }
    stepNum++;
    const newDv = cocycleNorm();
    const logEl = document.getElementById('log');
    const cls = newDv === 0 ? 'ok' : 'v';
    logEl.innerHTML += `<div class="${cls}">Step ${stepNum}: δω=${newDv.toFixed(1)} — [${positions.join(', ')}]</div>`;
    logEl.scrollTop = logEl.scrollHeight;
    draw();
    if (newDv === 0) {
      clearInterval(intervalId); intervalId = null;
      const status = document.getElementById('status');
      status.textContent = `✓ Cocyle resolved after ${stepNum} steps. δω = 0. Global consistency achieved.`;
      status.className = 'status show resolved';
    }
  }

  function reset() {
    clearInterval(intervalId); intervalId = null;
    positions = [...initialPositions];
    stepNum = 0;
    document.getElementById('log').innerHTML = '<span style="color:#888;">Press ▶ to animate the resolution</span>';
    document.getElementById('status').className = 'status';
    document.getElementById('dw-display').textContent = cocycleNorm().toFixed(1);
    draw();
  }

  function animate() {
    reset();
    document.getElementById('log').innerHTML = '';
    intervalId = setInterval(step, 400);
  }

  document.getElementById('btn-animate').addEventListener('click', animate);
  document.getElementById('btn-step').addEventListener('click', step);
  document.getElementById('btn-reset').addEventListener('click', reset);

  function size() { canvas.width = canvas.clientWidth; canvas.height = Math.max(400, canvas.clientWidth * 0.55); draw(); }
  size(); window.addEventListener('load', size); window.addEventListener('resize', size);
  setTimeout(function() { requestAnimationFrame(function() { size(); }); }, 50);
  reset();
})();
</script>
</body>
</html>
