<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monna Lens | Cocyle</title>
<meta name="description" content="Interactive: see the many-to-one Monna projection from ultrametric tree to Archimedean line.">
<link rel="stylesheet" href="../css/style.css">
<style>
  body { margin: 0; background: #fdfcfa; }
  .wrap { display: flex; width: 100vw; height: 85vh; }
  .panel { flex: 1; position: relative; border-right: 1px solid #e0ddd5; overflow: hidden; }
  .panel:last-child { border-right: none; }
  canvas { display: block; }
  .label { position: absolute; top: 12px; left: 16px; font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 600; color: #5e5e5e; background: rgba(253,252,250,0.85); padding: 4px 10px; border-radius: 4px; }
  .info { position: absolute; bottom: 12px; left: 16px; font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; color: #5e5e5e; }
  .back { padding: 8px 16px; font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; }
  .back a { color: #8b4513; text-decoration: none; }
  @media (max-width: 768px) { .wrap { flex-direction: column; height: auto; } .panel { height: 300px; border-right: none; border-bottom: 1px solid #e0ddd5; } }
</style>
</head>
<body>
<div class="back"><a href="../index.html">← The Branch and the Shadow</a></div>

<div class="wrap">
  <div class="panel" id="tree-panel">
    <canvas id="tree-canvas"></canvas>
    <div class="label">Ultrametric Tree (p=2, depth=6, 64 leaves)</div>
    <div class="info" id="tree-info">64 leaves</div>
  </div>
  <div class="panel" id="line-panel">
    <canvas id="line-canvas"></canvas>
    <div class="label">Monna Projection → [0, 1] — hover here</div>
    <div class="info" id="line-info">Hover over the line</div>
  </div>
</div>

<p style="text-align:center;padding:8px;font-size:14px;color:#5e5e5e;">
  <strong>Hover</strong> along the line (right) to see <strong>many leaves</strong> light up for <strong>one point</strong> — the many-to-one Monna projection.
</p>

<script>
(function() {
  const P = 2, DEPTH = 6, N = Math.pow(P, DEPTH);
  
  // Build leaves: each leaf is an array of DEPTH digits [d0,...,d5]  
  const leaves = [];
  for (let i = 0; i < N; i++) {
    const d = [];
    let t = i;
    for (let j = 0; j < DEPTH; j++) { d.unshift(t % P); t = Math.floor(t / P); }
    leaves.push(d);
  }
  
  // Monna map: Φ(Σ aₙpⁿ) = Σ aₙp⁻ⁿ⁻¹
  function monna(digits) {
    let v = 0;
    for (let n = 0; n < DEPTH; n++) v += digits[n] * Math.pow(P, -(n + 1));
    return v;
  }
  const leafVals = leaves.map(monna);

  const tc = document.getElementById('tree-canvas'), tctx = tc.getContext('2d');
  const lc = document.getElementById('line-canvas'), lctx = lc.getContext('2d');
  const treeInfo = document.getElementById('tree-info');
  const lineInfo = document.getElementById('line-info');

  let tw, th, lw, lh;
  let hlSet = new Set(); // which leaves are lit

  function size() {
    const tp = document.getElementById('tree-panel');
    const lp = document.getElementById('line-panel');
    tw = tc.width = tp.clientWidth;
    th = tc.height = tp.clientHeight;
    lw = lc.width = lp.clientWidth;
    lh = lc.height = lp.clientHeight;
    draw();
  }

  function draw() {
    // ── TREE ──
    tctx.clearRect(0, 0, tw, th);
    const mx = 20, my = 20, bx = tw - 20, by = th - 30;
    if (N > 1) {
      const spacing = (bx - mx) / (N - 1);
      const lvlH = (by - my) / DEPTH;
      // Recursive branch drawing
      function branch(lv, s, e, px, py) {
        if (lv >= DEPTH) return;
        const y = my + lv * lvlH;
        const segs = [];
        let ss = s;
        for (let i = s + 1; i <= e; i++) {
          if (i === e || leaves[i][lv] !== leaves[ss][lv]) { segs.push({s:ss,e:i-1}); ss = i; }
        }
        segs.push({s:ss,e:e});
        for (const seg of segs) {
          const mx2 = mx + ((seg.s + seg.e) / 2) * spacing;
          if (px !== null) { tctx.beginPath(); tctx.moveTo(px, py); tctx.lineTo(mx2, y); tctx.strokeStyle = '#ccc'; tctx.lineWidth = 0.5; tctx.stroke(); }
          branch(lv + 1, seg.s, seg.e, mx2, y);
        }
      }
      branch(0, 0, N - 1, null, null);
      // Draw leaf dots
      for (let i = 0; i < N; i++) {
        const x = mx + i * spacing;
        tctx.beginPath();
        tctx.arc(x, by, 3, 0, Math.PI * 2);
        tctx.fillStyle = hlSet.has(i) ? '#e07030' : '#88aacc';
        tctx.fill();
      }
    }
    treeInfo.textContent = `${N} leaves (p=${P}, depth=${DEPTH})`;

    // ── LINE ──
    lctx.clearRect(0, 0, lw, lh);
    const lx = 40, rx = lw - 25, ly = lh / 2;
    lctx.beginPath(); lctx.moveTo(lx, ly); lctx.lineTo(rx, ly);
    lctx.strokeStyle = '#333'; lctx.lineWidth = 1.5; lctx.stroke();
    lctx.font = '12px sans-serif'; lctx.fillStyle = '#888';
    for (let f = 0; f <= 1; f += 0.1) {
      const x = lx + f * (rx - lx);
      lctx.beginPath(); lctx.moveTo(x, ly - 5); lctx.lineTo(x, ly + 5);
      lctx.strokeStyle = '#bbb'; lctx.stroke();
      lctx.fillText(f.toFixed(1), x - 8, ly + 18);
    }
    lineInfo.textContent = hlSet.size > 0 ? `${hlSet.size} leaves lit` : 'Hover over the line';
  }

  // Hover handler
  lc.addEventListener('mousemove', function(e) {
    const rect = lc.getBoundingClientRect();
    const sx = 40, ex = lw - 25;
    const mx2 = (e.clientX - rect.left) * (lw / rect.width);
    if (mx2 < sx || mx2 > ex) { hlSet = new Set(); draw(); return; }
    const t = (mx2 - sx) / (ex - sx);
    const eps = 0.015;
    hlSet = new Set();
    leafVals.forEach(function(v, i) { if (Math.abs(v - t) < eps) hlSet.add(i); });
    draw();
  });
  lc.addEventListener('mouseleave', function() { hlSet = new Set(); draw(); });

  // Init: multiple fallbacks to ensure canvas sizes
  size(); // try immediately
  window.addEventListener('load', size);
  window.addEventListener('resize', size);
  setTimeout(function() { requestAnimationFrame(function() { size(); }); }, 50);
})();
</script>
</body>
</html>
